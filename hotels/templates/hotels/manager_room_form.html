{% extends "base.html" %}

{% block title %}TravelMate | Add room{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-lg-7">
        <p class="mb-2">
            <a class="text-decoration-none" href="{% url 'manager_hotel_list' %}">&larr; Back to hotels</a>
        </p>
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h4 mb-1">Add room</h1>
                <p class="text-muted small mb-4">{{ hotel.name }}</p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary" type="submit">Save room</button>
                        <a class="btn btn-outline-secondary" href="{% url 'manager_hotel_list' %}">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
